[package]
name = "opensocket-mobile"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "OpenSocket companion app (Tauri 2 shell — all logic lives in the TS webview)"

[lib]
name = "opensocket_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
